# ──────────────────────────────────────────────────────────────────
# config-staging.properties – staging / QA environment overrides
# ──────────────────────────────────────────────────────────────────

# Staging base URL (update when staging is available)
base.url=https://rivio-angular-staging.vercel.app/

browser=chrome
headless=true

implicit.wait=15
explicit.wait=30
page.load.timeout=45

# Staging credentials (may differ from production)
admin.email=admin@rivio.com
admin.password=stagingpassword

hr.email=hr@rivio.com
hr.password=stagingpassword

manager.email=manager@rivio.com
manager.password=stagingpassword

payroll.email=payroll@gmail.com
payroll.password=stagingpassword

employee.email=employee@rivio.com
employee.password=stagingpassword

environment=staging
