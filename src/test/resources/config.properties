# ──────────────────────────────────────────────────────────────────
# config.properties – test configuration for Rivio Automation Suite
# ──────────────────────────────────────────────────────────────────

# Application
base.url=https://rivio-angular.vercel.app/

# Browser: chrome | firefox | edge
browser=chrome

# Headless mode: true | false
headless=false

# Timeouts (seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Credentials – SuperAdmin
admin.email=admin@rivio.com
admin.password=password

# Credentials – HR
hr.email=hr@rivio.com
hr.password=password

# Credentials – Manager
manager.email=manager@rivio.com
manager.password=password

# Credentials – Payroll Manager
payroll.email=payroll@gmail.com
payroll.password=password

# Credentials – Employee
employee.email=employee@rivio.com
employee.password=password

# Report
report.path=src/test/resources/test-output/reports/ExtentReport.html
screenshot.path=src/test/resources/test-output/screenshots/

# Environment
environment=production
